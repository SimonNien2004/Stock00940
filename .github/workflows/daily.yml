name: 00940 每日加碼報告

on:
  schedule:
    - cron: "0 8 * * 1-5"      # 週一至週五 16:00（台北時間 = UTC+8）
  workflow_dispatch:            # 也可以在 Actions 分頁手動執行

permissions:
  contents: write               # 需要把報告與資料 commit 回 repo

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 抓資料、預測、產生報告
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TZ: Asia/Taipei
        run: python run_daily.py

      - name: 儲存結果到 repo
        run: |
          git config user.name "00940-bot"
          git config user.email "00940-bot@users.noreply.github.com"
          git add data reports
          if git diff --staged --quiet; then
            echo "沒有變更"
          else
            git commit -m "每日報告 $(TZ=Asia/Taipei date +%F)"
            git pull --rebase
            git push
          fi
